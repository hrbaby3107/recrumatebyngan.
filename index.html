<html lang="en">

    <script>
      try {
        var d = document.documentElement;
        var ap = JSON.parse(localStorage.getItem("recrumate-appearance-v2") || "{}");
        if (ap.accent) d.setAttribute("data-accent", ap.accent);
        if (ap.density) d.setAttribute("data-density", String(ap.density).toLowerCase());
        if (localStorage.getItem("recrumate-dark") === "1") d.classList.add("dark");
      } catch (e) {}
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
